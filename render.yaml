services:
  - type: web
    name: aeo-diagnostic-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["*"]'
